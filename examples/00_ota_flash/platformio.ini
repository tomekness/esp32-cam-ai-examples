[env]
platform = espressif32
board = esp32cam
framework = arduino
board_build.partitions = min_spiffs.csv

[env:esp32cam_cable]
upload_speed = 115200
upload_flags = --no-stub
monitor_speed = 115200

[env:esp32cam_ota_espWlan]
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=ota1234
    --host_port=12345
    --timeout=60

[env:esp32cam_ota_internet]
upload_protocol = espota
upload_port = ESP32-CAM-01.local
upload_flags =
    --auth=ota1234
    --host_port=12345
    --timeout=60
